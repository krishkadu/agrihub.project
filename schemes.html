<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Discover 15+ Indian government schemes for farmers. PM-Kisan, Fasal Bima, PM-KUSUM and more with direct apply links.">
    <meta property="og:title" content="Government Schemes — AgriHub">
    <meta name="theme-color" content="#10B981">
    <title>Government Schemes — AgriHub</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <style>
      .ah-icon{width:16px;height:16px;margin-right:5px;vertical-align:middle;flex-shrink:0;display:inline-block;}
      .ah-icon-lg{width:22px;height:22px;}
      .ah-green{color:#16a34a;}.ah-blue{color:#3b82f6;}.ah-purple{color:#7c3aed;}
      .ah-yellow{color:#ca8a04;}.ah-gray{color:#6b7280;}.ah-orange{color:#ea580c;}
      h1,h2,h3,h4{font-family:'Poppins','DM Sans',sans-serif;}
    </style>
</head>

<body>
    <div class="page-progress" id="pageProgress"></div>
    <header class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <div class="nav-brand"><span class="brand-icon">🌾</span><a href="index.html" class="brand-text">Agri<span
                        class="brand-accent">Hub</span></a></div>
            <nav class="nav-links" id="navLinks">
                <a href="index.html" data-i18n="nav_home"><i data-lucide="home" class="ah-icon ah-green"></i>Home</a>
                <a href="fertilizer.html" data-i18n="nav_fertilizer"><i data-lucide="leaf" class="ah-icon ah-green"></i>Fertilizer</a>
                <a href="polyhouse.html" data-i18n="nav_polyhouse"><i data-lucide="warehouse" class="ah-icon ah-green"></i>Polyhouse</a>
                <a href="schemes.html" class="active" data-i18n="nav_schemes"><i data-lucide="file-text" class="ah-icon ah-yellow"></i>Schemes</a>
                <a href="weather.html" data-i18n="nav_weather"><i data-lucide="cloud-sun" class="ah-icon ah-blue"></i>Weather</a>
                <a href="crop-advisor.html" data-i18n="nav_advisor"><i data-lucide="brain" class="ah-icon ah-purple"></i>Crop Advisor</a>
                <a href="ai-assistant.html" data-i18n="nav_ai_assistant"><i data-lucide="bot" class="ah-icon ah-pink"></i>AI Assistant</a>
                <a href="pesticide.html" data-i18n="nav_pesticide"><i data-lucide="shield-alert" class="ah-icon ah-red"></i>Pesticides</a>
            </nav>
            <div class="nav-actions">
                <select id="languageSelector" class="lang-select" aria-label="Select Language">
                    <option value="en">🌐 English</option>
                    <option value="hi">हिन्दी</option>
                    <option value="mr">मराठी</option>
                </select>
                <div id="authButtons"><button class="btn-nav-outline" id="openLogin">Login</button><button
                        class="btn-nav-primary" id="openRegister">Register</button></div>
                <div id="userMenu" class="user-menu hidden"><span class="user-greeting" id="userGreeting">👋
                        Hello</span><a href="dashboard.html" class="btn-nav-outline">Dashboard</a><button
                        class="btn-nav-outline" id="logoutBtn">Logout</button></div>
            </div>
            <button class="hamburger" id="hamburger"
                aria-label="Toggle menu"><span></span><span></span><span></span></button>
        </div>
    </header>
    <div class="nav-overlay" id="navOverlay"></div>

    <section class="page-hero">
        <div class="hero-bg">
            <img src="govt cover.png"
                alt="Government schemes for Indian farmers" class="hero-img" loading="eager">
            <div class="hero-overlay"></div>
        </div>
        <div class="page-hero-content animate-fade-up">
            <h1 data-i18n="schemes_title"><i data-lucide="file-text" class="ah-icon-lg ah-yellow"></i>Government Schemes</h1>
            <p data-i18n="schemes_subtitle">15+ central government programs for farmers</p>
        </div>
    </section>

    <section class="section-padding">
        <div class="container">
            <!-- Search -->
            <div class="search-bar">
                <div class="search-bar-wrapper">
                    <span class="search-icon"></span>
                    <input type="text" id="schemeSearch" placeholder="Search schemes by name or keyword..." data-i18n-placeholder="schemes_search_ph">
                </div>
            </div>
            <!-- Filters -->
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all" data-i18n="schemes_filter_all"><i data-lucide="layout-grid" class="ah-icon"></i>All</button>
                <button class="filter-btn" data-filter="subsidy" data-i18n="schemes_filter_subsidy"><i data-lucide="indian-rupee" class="ah-icon ah-green"></i>Subsidy</button>
                <button class="filter-btn" data-filter="insurance" data-i18n="schemes_filter_insurance"><i data-lucide="shield-check" class="ah-icon ah-blue"></i>Insurance</button>
                <button class="filter-btn" data-filter="credit" data-i18n="schemes_filter_credit"><i data-lucide="credit-card" class="ah-icon ah-purple"></i>Credit</button>
                <button class="filter-btn" data-filter="market" data-i18n="schemes_filter_market"><i data-lucide="store" class="ah-icon ah-orange"></i>Market</button>
                <button class="filter-btn" data-filter="technology" data-i18n="schemes_filter_technology"><i data-lucide="cpu" class="ah-icon ah-gray"></i>Technology</button>
            </div>
            <!-- Grid -->
            <div class="schemes-grid" id="schemesGrid"></div>
            <div class="text-center" style="margin-top:40px;"><a href="index.html" class="btn-back" data-i18n="btn_back_home">← Back to Home</a>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border-top:none;">
                <p>© 2025 AgriHub. Made with <i data-lucide="heart" style="width:14px;height:14px;color:#10B981;vertical-align:middle;"></i> for Indian Farmers.</p>
                <div class="footer-links-inline"><a href="#">Privacy Policy</a><a href="#">Terms of Service</a></div>
            </div>
        </div>
    </footer>

    <button class="scroll-top" id="scrollToTop" aria-label="Scroll to top">↑</button>
    <div class="toast-container" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/translations.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/ai-assistant.js"></script>
    <script src="assets/js/schemes.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
